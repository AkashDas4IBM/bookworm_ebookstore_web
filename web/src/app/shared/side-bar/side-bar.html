<mat-sidenav-container class="bg-secondary-black2 text-white font-lato">
    
    <!-- Left Responsive Sidebar Drawer (20% width on desktop side mode) -->
    <mat-sidenav #sidenav [mode]="isMobile() ? 'over' : 'side'" [disableClose]="true" [(opened)]="isSidebarOpen" class="custom-mat-sidenav select-none custom-scrollbar">
        <div class="py-3 flex flex-col h-full">

            <!-- Drawer Header with Close Button -->
            <div class="flex items-center justify-between px-4 pb-3 mb-2 border-b border-neutral-800">
                <span class="font-poppins font-semibold text-sm tracking-wide text-neutral-200">Collections</span>
                <button mat-icon-button (click)="toggleSidebar()" class="custom-mat-close-btn">
                    <mat-icon>close</mat-icon>
                </button>
            </div>

            <!-- Dynamic Book Collections List -->
            <nav aria-label="Book Collections" class="flex flex-col space-y-0.5 overflow-y-auto flex-1">
                <button *ngFor="let category of bookCollections()" type="button" (click)="selectCategory(category)"
                    [ngClass]="selectedCategory() === category ? 'bg-secondary-black4 text-white border-l-4 border-blue-500 font-medium pl-3' : 'text-neutral-300 hover:bg-neutral-800/60 hover:text-white border-l-4 border-transparent pl-3'"
                    class="w-full text-left pr-4 py-2.5 text-[13.5px] transition-all duration-150 cursor-pointer focus:outline-none">
                    {{ category }}
                </button>

                @if (categoriesFailed()) {
                    <div class="px-4 py-3 text-xs text-neutral-400">
                        Could not load collections.
                        <button type="button" class="text-blue-400 underline" (click)="getCategoryCollectionsData()">Retry</button>
                    </div>
                }
            </nav>
        </div>
    </mat-sidenav>

    <!-- Main Content Area (Automatically scales to 80% when open, 100% when closed) -->
    <mat-sidenav-content class="bg-secondary-black3 text-neutral-100">

        <!-- Mobile Filter Bar (Visible only on mobile/tablet) -->
        <div *ngIf="isMobile()"
            class="sticky top-0 z-10 flex items-center justify-between px-4 py-2.5 bg-secondary-black/95 backdrop-blur border-b border-neutral-800">
            <button type="button" (click)="toggleSidebar()"
                class="flex items-center space-x-2 text-sm font-medium text-neutral-200 hover:text-mint-500 transition-colors cursor-pointer">
                <mat-icon class="menu-bar-open">menu_open</mat-icon>
                <span>Browse Genres</span>
            </button>
            <span class="text-xs px-2.5 py-1 rounded bg-neutral-800 text-mint-500 font-medium">
                {{ selectedCategory() }}
            </span>
        </div>

        <!-- Projected Page Content -->
        <div class="p-4 sm:p-6">
            <ng-content></ng-content>
        </div>

    </mat-sidenav-content>
</mat-sidenav-container>
