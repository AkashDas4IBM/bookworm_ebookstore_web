<div class="flex flex-col bg-secondary-black border border-neutral-800 p-3 rounded-lg flex-1 min-w-40">
    <label class="text-xs text-neutral-400 mb-1 font-lato">Price Range</label>
    <div class="relative flex items-center">
        <select [ngModel]="filterService.filters().priceRange" (ngModelChange)="filterService.updatePriceRange($event)"
            class="w-full bg-transparent text-neutral-200 text-sm focus:outline-none appearance-none cursor-pointer pr-6">
            <option value="All" class="bg-secondary-black">All</option>
            <option value="Under ₹100" class="bg-secondary-black">Under ₹100</option>
            <option value="₹100 - ₹250" class="bg-secondary-black">₹100 - ₹250</option>
            <option value="₹250 - ₹500" class="bg-secondary-black">₹250 - ₹500</option>
            <option value="Over ₹500" class="bg-secondary-black">Over ₹500</option>
        </select>
        <mat-icon class="absolute right-0 text-neutral-400 pointer-events-none text-lg">expand_more</mat-icon>
    </div>
</div>
