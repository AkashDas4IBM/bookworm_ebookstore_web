<div
  class="flex flex-col bg-secondary-black border border-neutral-800 p-3 rounded-lg flex-1 min-w-[220px]"
>
  <label class="text-xs text-neutral-400 mb-1 font-lato">Search you want to read here</label>
  <div class="relative flex items-center">
    <input
      type="text"
      [ngModel]="filterService.filters().search"
      (ngModelChange)="filterService.updateSearch($event)"
      placeholder="Search"
      class="w-full bg-transparent text-neutral-200 placeholder-neutral-500 text-sm focus:outline-none pr-8"
    />

    <mat-icon class="absolute right-0 text-neutral-400 pointer-events-none text-lg"
      >search</mat-icon
    >
  </div>
</div>
