<div class="flex flex-col bg-secondary-black border border-neutral-800 p-3 rounded-lg flex-1 min-w-50">
    <label class="text-xs text-neutral-400 mb-1 font-lato">Format (Paperback, ebook etc)</label>
    <div class="relative flex items-center">
        <select [ngModel]="filterService.filters().format" (ngModelChange)="filterService.updateFormat($event)"
            class="w-full bg-transparent text-neutral-200 text-sm focus:outline-none appearance-none cursor-pointer pr-6">
            <option value="All" class=" bg-secondary-black">All</option>
            <option value="Paperback" class=" bg-secondary-black">Paperback</option>
            <option value="Hardcover" class=" bg-secondary-black">Hardcover</option>
            <option value="E-Book" class=" bg-secondary-black">E-Book</option>
            <option value="Audiobook" class=" bg-secondary-black">Audiobook</option>
        </select>
        <mat-icon class="absolute right-0 text-neutral-400 pointer-events-none text-lg">expand_more</mat-icon>
    </div>
</div>
