<div class="flex flex-col bg-secondary-black border border-neutral-800 p-3 rounded-lg flex-1 min-w-40">
  <label class="text-xs text-neutral-400 mb-1 font-lato">Language</label>
  <div class="relative flex items-center">
    <select
      [ngModel]="filterService.filters().language"
      (ngModelChange)="filterService.updateLanguage($event)"
      class="w-full bg-transparent text-neutral-200 text-sm focus:outline-none appearance-none cursor-pointer pr-6"
    >
      <option value="All" class="bg-secondary-black">All</option>
      <option value="English" class="bg-secondary-black">English</option>
      <option value="Spanish" class="bg-secondary-black">Spanish</option>
      <option value="French" class="bg-secondary-black">French</option>
      <option value="German" class="bg-secondary-black">German</option>
    </select>
    <mat-icon class="absolute right-0 text-neutral-400 pointer-events-none text-lg"
      >expand_more</mat-icon
    >
  </div>
</div>
