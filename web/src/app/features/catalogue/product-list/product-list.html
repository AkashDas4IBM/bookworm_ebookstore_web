<div class="space-y-4 font-lato select-none">
  <nav class="text-xs text-neutral-300 flex items-center space-x-2" aria-label="Breadcrumb">
    <a routerLink="/home" class="text-blue-400 hover:underline">Home</a>
    <span>/</span>
    <span class="text-neutral-100">{{ title() }}</span>
  </nav>

  <h2 class="text-lg font-semibold font-poppins text-white tracking-wide border-b border-neutral-800 pb-2">{{ title() }}</h2>

  @if (loading()) {
    <p class="text-sm text-neutral-400 py-6 text-center">Loading books...</p>
  } @else {
    <div class="product-grid">
      @for (book of products(); track book.id) {
        <app-product-card [book]="book"></app-product-card>
      } @empty {
        <p class="text-sm text-neutral-400 py-6 text-center border border-dashed border-neutral-800 rounded-lg col-span-full">No Products Found.</p>
      }
    </div>
  }
</div>
