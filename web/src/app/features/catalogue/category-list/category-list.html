<div class="space-y-4 font-lato select-none">
  <h2 class="text-lg font-semibold font-poppins text-white tracking-wide border-b border-neutral-800 pb-2">Browse Categories</h2>

  @if (loading()) {
    <p class="text-sm text-neutral-400 py-6 text-center">Loading categories...</p>
  } @else {
    <div class="category-grid">
      @for (c of categories(); track c.id) {
        <a [routerLink]="['/catalogue/categories', c.name, 'brands']" class="category-tile">{{ c.name }}</a>
      } @empty {
        <p class="text-sm text-neutral-400 col-span-full">No categories found.</p>
      }
    </div>
  }
</div>
